# Hardened Redis: AOF persistence on a PVC, so a restart keeps queued jobs.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: redis-data, namespace: n8n-chaos}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: n8n-chaos
  labels: {app: redis}
spec:
  replicas: 1
  strategy: {type: Recreate}   # RWO volume: never two pods at once
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7.4.5-alpine
          args: ["--appendonly", "yes", "--appendfsync", "everysec", "--dir", "/data"]
          ports: [{containerPort: 6379, name: redis}]
          readinessProbe: {exec: {command: ["redis-cli", "ping"]}, periodSeconds: 5}
          resources: {requests: {cpu: 50m, memory: 64Mi}}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: redis-data}}
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: n8n-chaos}
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: redis, name: redis}]
---
apiVersion: v1
kind: Service
metadata: {name: redis-nodeport, namespace: n8n-chaos}
spec:
  type: NodePort
  selector: {app: redis}
  ports: [{port: 6379, targetPort: redis, nodePort: 30379, name: redis}]
