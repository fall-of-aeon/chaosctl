# Host access to n8n main (webhooks + UI) via Kind NodePort 30678 -> 127.0.0.1:15678.
apiVersion: v1
kind: Service
metadata: {name: n8n-main-nodeport, namespace: n8n-chaos}
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/instance: n8n
    app.kubernetes.io/component: main
  ports: [{port: 5678, targetPort: 5678, nodePort: 30678, name: http}]
