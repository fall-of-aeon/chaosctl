# Safety policy (BUILD_PLAN section 8). Calibrate against state/baseline.json in T4.
defaults:
  abort:
    w1_error_rate: 0.5          # rolling window
    w1_p95_ms: 20000            # mock delay is 4 s; generous headroom
    queue_waiting: 500
    error_rate_armed_after_s: 0 # reversible faults: armed immediately
tiers:
  1: {max_total_s: 180, error_rate_armed_after_s: 90}   # one-shot: expected-impact window first
  2: {max_duration_s: 45, max_total_s: 120}
  3: {max_total_s: 180, error_rate_abort: false}         # outage by design
experiments:
  worker_pod_kill: {recovery_deadline_s: 120}
  redis_pod_kill: {recovery_deadline_s: 120}
  pod_failure: {recovery_deadline_s: 120}
fate_wait_s: 180
rules:
  never_target_outside_namespace: n8n-chaos
  tier3_requires_prior_tier1_pass: true
  abort_on_unexpected_workload_unready: true
  abort_if_safety_controller_unhealthy: true
  preflight_chaos_daemon_ready: true
  require_in_flight_before_inject: {min_in_flight: 3, wait_timeout_s: 90}
