  root_cause: "The Redis queue became unavailable and lost its state, so queued and running jobs disappeared."
  priority: 20
grading_keywords: [redis, queue]
related_fixes: [redis_persistence, redis_timeout_threshold, idempotency_keys, async_status_callback]
