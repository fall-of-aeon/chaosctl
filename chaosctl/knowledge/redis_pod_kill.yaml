  queued and active jobs are lost because redis has no persistence; n8n may restart
  if the outage exceeds the 10 s redis timeout
symptoms:
  expected: [queue_unreachable, latency_degradation]
  possible: [queue_state_lost, lost_work, dependency_restart, silent_async_failure, detectability_gap]
signature:
