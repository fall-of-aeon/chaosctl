# Knowledge for catalog fault worker_container_kill (format: docs/KNOWLEDGE_BASE.md)
fault: worker_container_kill
alias: E9
title: Worker container kill
category: compute_loss
summary: Kill the n8n-worker container in place (same pod, restart count +1) while executions are running.
hypothesis: the worker container restarts in place (restart count +1); its active jobs stall until lock expiry and
  are redelivered; W1 p95 rises, the other worker keeps going
