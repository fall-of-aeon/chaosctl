# Source: n8n/templates/tests/test-connection.yaml
apiVersion: v1
kind: Pod
metadata:
  name: "n8n-test-connection"
  labels:
    helm.sh/chart: n8n-1.15.0
    app.kubernetes.io/name: n8n
    app.kubernetes.io/instance: n8n
    app.kubernetes.io/version: "2.42.4"
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  containers:
    - name: wget
      image: busybox:1.36
      command:
        - wget
        - "--spider"
        - "--timeout=10"
        - "http://n8n-main:5678/healthz"
  restartPolicy: Never

