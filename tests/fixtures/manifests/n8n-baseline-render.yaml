# Source: n8n/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n
  namespace: n8n-chaos
  labels:
    helm.sh/chart: n8n-1.15.0
    app.kubernetes.io/name: n8n
    app.kubernetes.io/instance: n8n
    app.kubernetes.io/version: "2.42.4"
    app.kubernetes.io/managed-by: Helm
data:
  # ----- Shared Configuration (used by all components: main, worker, webhook-processor) -----
  TZ: "UTC"
  
  # Database configuration
  DB_TYPE: "postgresdb"
  DB_POSTGRESDB_DATABASE: "n8n"
  DB_POSTGRESDB_HOST: "postgres"
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_USER: "n8n"
  DB_POSTGRESDB_SCHEMA: "public"

  # Queue configuration
  EXECUTIONS_MODE: "queue"
  # Always "true", and "n8n.mainTaskRunnersEnabled" depends on it: n8n skips
  # task runner startup on main when offloading is on, so the chart drops the
  # main-pod sidecar. If this ever becomes configurable, that helper must read
  # it rather than queueMode.enabled.
  OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
  # Task runner configuration (only emitted when sidecars are enabled,
  # otherwise n8n uses its built-in internal runner default).
  # Redis configuration (queue mode only)
  QUEUE_BULL_REDIS_HOST: "redis"
  QUEUE_BULL_REDIS_PORT: "6379"
  QUEUE_BULL_REDIS_TIMEOUT_THRESHOLD: "10000"

  # Worker settings (queue mode only)
  QUEUE_WORKER_LOCK_DURATION: "60000"
  QUEUE_WORKER_LOCK_RENEW_TIME: "10000"
  QUEUE_WORKER_STALLED_INTERVAL: "30000"
  QUEUE_WORKER_MAX_STALLED_COUNT: "1"

  # Graceful shutdown timeout
  N8N_GRACEFUL_SHUTDOWN_TIMEOUT: "30"
  
  # ----- Main-only Configuration -----
  N8N_WEBHOOK_URL: "http://127.0.0.1:15678"
  N8N_WEBHOOK_TIMEOUT: "120000"
  
  # Editor Base URL (for proper webhook URL display in UI)
  # Only set when external access is configured to avoid issues with internal-only deployments
  # If custom webhook URL is set, use it as editor base URL (since webhook.url is the domain)
  N8N_EDITOR_BASE_URL: "http://127.0.0.1:15678"
  
  # Multi-main setup (main pods only)
  
  # ----- Webhook Processor Configuration -----

