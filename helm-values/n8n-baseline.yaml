# Baseline profile: 1 worker, no PDB, no limits, default probes. E1/E2 run here.
image:
  tag: "2.42.4"
queueMode:
  enabled: true
  workerReplicaCount: 1
  workerConcurrency: 10
secretRefs:
  existingSecret: n8n-secrets   # N8N_ENCRYPTION_KEY, N8N_HOST, N8N_PORT, N8N_PROTOCOL (scripts/up.sh)
database:
  host: postgres
  port: 5432
  database: n8n
  user: n8n
  passwordSecret: {name: pg-secrets, key: password}
redis:
  host: redis
  port: 6379
  healthCheck:
    enabled: true             # QUEUE_HEALTH_CHECK_ACTIVE on workers
webhook:
  url: "http://127.0.0.1:15678"
pdb:
  enabled: false
config:
  extraEnv:
    - {name: N8N_METRICS, value: "true"}
    - {name: N8N_METRICS_INCLUDE_QUEUE_METRICS, value: "true"}
    - {name: N8N_DIAGNOSTICS_ENABLED, value: "false"}
    - {name: N8N_VERSION_NOTIFICATIONS_ENABLED, value: "false"}
    - {name: N8N_PERSONALIZATION_ENABLED, value: "false"}
