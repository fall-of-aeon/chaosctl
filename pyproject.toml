[project]
name = "chaos-n8n"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.29.0",
    "httpx>=0.28.1",
    "kubernetes>=37.0.1",
    "langgraph>=1.2.14",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
chaosctl = "chaosctl.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chaosctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
